[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-solver"
version = "0.1.0"
description = "Hybrid computational physics platform - combining FEM, FVM, meshless, and neural operators"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Chimera Contributors"}
]
keywords = [
    "simulation", "FEM", "FVM", "CFD", "FEA",
    "multiphysics", "neural-operators", "hybrid-solver"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "sympy>=1.9",
    "matplotlib>=3.5.0",
    "meshio>=5.0.0",
]

[project.optional-dependencies]
neural = [
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
all = [
    "chimera-solver[neural,dev]",
]

[project.urls]
Homepage = "https://github.com/chimera-solver/chimera"
Documentation = "https://chimera-solver.readthedocs.io"
Repository = "https://github.com/chimera-solver/chimera"

[project.scripts]
chimera = "chimera.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
